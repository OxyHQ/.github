name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below to help us investigate.
  - type: input
    id: product
    attributes:
      label: Product
      description: Which Oxy product is this about?
      placeholder: "e.g., Mention, Allo, Platform, OxyOS, Bloom"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version, SDK version, or commit hash.
      placeholder: "e.g., 1.2.3 or abc1234"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - Desktop (Linux)
        - Desktop (macOS)
        - Desktop (Windows)
        - API/Server
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or any other relevant information.
