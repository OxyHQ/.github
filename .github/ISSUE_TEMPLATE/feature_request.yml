name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature requests. Please describe your idea clearly so we can evaluate it.
  - type: input
    id: product
    attributes:
      label: Product
      description: Which Oxy product is this for?
      placeholder: "e.g., Mention, Allo, Platform, OxyOS, Bloom"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or links to related issues.
